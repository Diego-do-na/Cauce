# tasks.yaml — the single source of truth for Cauce's task board.
#
# HARD RULE: never edit this file by hand outside of scripts/*.py.
# All mutations must go through scripts/claim_task.py, scripts/finish_task.py,
# or scripts/add_task.py so that concurrent git pushes are handled safely
# (git pull --rebase + retry) and every reader (poller.py, boss-dashboard,
# model-requester) can rely on the schema below staying consistent.
#
# Schema, per task in the `tasks:` list:
#
#   id:               string, unique, stable identifier (e.g. "T001").
#                      Generated by add_task.py — never reuse an id.
#   title:            short human-readable summary of the task.
#   description:      full prompt/spec text handed to the coding agent
#                      (Claude Code, Cursor, ...) that picks this up.
#   scope:            list of repo-relative paths (files or directories)
#                      this task is expected to touch. Used to detect
#                      collisions between tasks that are claimed/in-flight
#                      at the same time (see scripts/common.py:scopes_overlap).
#   depends_on:       list of task ids that must all be status=done
#                      before this task is eligible to be claimed.
#   suggested_model:  free-form hint string (e.g. "claude-sonnet",
#                      "claude-opus", "cursor"). This is ONLY a hint for
#                      whoever/whatever picks up the task — no script
#                      reads or enforces it.
#   status:           one of "todo" | "claimed" | "done".
#   owner:            name of the person who claimed the task, or null.
#   branch:           git branch created for this task (task/<id>), or null.
#   claimed_at:       ISO-8601 UTC timestamp of when it was claimed, or null.
#   done_at:          ISO-8601 UTC timestamp of when it was marked done, or null.

tasks:
  - id: T001
    title: Set up project scaffolding
    description: >
      Create the base folder structure for the new service, including
      the package layout, a minimal entrypoint, and empty config files.
      No business logic yet — this just gives later tasks something to
      build on.
    scope:
      - src/
      - pyproject.toml
    depends_on: []
    suggested_model: claude-sonnet
    status: todo
    owner: null
    branch: null
    claimed_at: null
    done_at: null

  - id: T002
    title: Implement the health check endpoint
    description: >
      Add a GET /health endpoint that returns {"status": "ok"} once the
      scaffolding from T001 is in place. Include a basic test.
    scope:
      - src/api/health.py
      - tests/test_health.py
    depends_on:
      - T001
    suggested_model: cursor
    status: todo
    owner: null
    branch: null
    claimed_at: null
    done_at: null
