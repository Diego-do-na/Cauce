# discord_map.yaml — maps the "owner" name used in tasks.yaml (and passed
# via --owner / git config user.name) to a Discord user id, so
# orchestration/scripts/notify_discord.py can DM the right person in
# bot-token mode.
#
# How to get a user's id: enable Developer Mode in Discord
# (Settings > Advanced > Developer Mode), then right-click their name
# and choose "Copy User ID".
#
# This is only used when DISCORD_BOT_TOKEN is set. It is ignored when
# DISCORD_WEBHOOK_URL is set (webhook mode posts to a channel, not a DM).

Alice: "111111111111111111"
Bob: "222222222222222222"
Carol: "333333333333333333"
Dave: "444444444444444444"
